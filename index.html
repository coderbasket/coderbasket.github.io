<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coder Basket - Developer Libraries, Tools & Projects</title>

        content="Coder Basket - Discover developer libraries, open source projects, AI tools, templates and code resources.">

    <link rel="icon" href="/img/codericon.png">

    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/sidebar.css">

<body>

    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="site-header">
        <div class="container header-inner">

            <a href="/" class="logo">
                <img src="/img/codericon.png" alt="CoderIcon" style="max-width: 50px; height: auto;">
                <span>Coder Basket</span>
            </a>

            <button class="menu-toggle" id="menuToggle" aria-label="Open navigation" aria-expanded="false">
                ☰
            </button>

            <nav id="mainNav" class="main-nav">
                <!-- Generated by header.js -->
            </nav>

        </div>
    </header>

    <!-- =====================================================
         MAIN
         ===================================================== -->

    <main>

        <section class="hero">

            <div class="container">

                <div class="search-box">

                    <input id="searchInput" type="search" placeholder="Search projects, libraries and tools..."
                        autocomplete="off">

                    <button id="searchButton">
                        Search
                    </button>

                </div>

                <p>
                    Developer libraries, tools, templates and open source projects.
                </p>

            </div>

        </section>


        <section class="catalog-section">

            <div class="container catalog-layout">

                <!-- =====================================================
                     CATEGORY NAVIGATION (Rendered by sidebar.js)
                     ===================================================== -->

                <aside id="categorySidebar" class="category-sidebar">
                    <!-- Rendered dynamically by sidebar.js -->
                </aside>


                <section class="catalog-content">

                    <div class="catalog-header">

                        <h2>Featured Projects</h2>

                        <div class="sort-select-wrapper">
                            <select id="sortSelect" aria-label="Sort options">
                                <option value="featured">Featured</option>
                                <option value="name">Name</option>
                                <option value="recent">Recently Updated</option>
                            </select>
                        </div>

                    </div>


                    <div id="projectGrid" class="project-grid">
                    </div>


                    <div id="loading" class="catalog-loading">
                        Loading projects...
                    </div>


                    <button id="loadMore" class="load-more" hidden>
                        Load More
                    </button>

                </section>

            </div>

        </section>

    </main>


    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer class="site-footer">

        <div class="container">

            <div>

                <strong id="footerName">
                    Coder Basket
                </strong>

                <p id="footerDescription">
                    Useful software, libraries, tools, and projects.
                </p>

            </div>

            <nav aria-label="Footer navigation">

                <a href="/">
                    Home
                </a>

                <a href="/about/">
                    About
                </a>

                <a href="/privacy/">
                    Privacy
                </a>

                <a href="/terms/">
                    Terms
                </a>

                <a id="footerEmail" href="#">
                    Email
                </a>

                <a id="footerGithub" href="#" target="_blank" rel="noopener noreferrer">
                    GitHub
                </a>

            </nav>

            <div class="copyright">

                © <span id="footerYear"></span>
                <span id="footerCopyrightName">Coder Basket</span>.
                All rights reserved.

            </div>

        </div>

    </footer>


    <!-- =====================================================
         JAVASCRIPT

    <script src="/js/data.js" defer></script>

    <script src="/js/header.js" defer></script>
    <script src="/js/app.js" defer></script>

    <script src="/js/footer.js"></script>
