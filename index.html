<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-adsense-account" content="ca-pub-9045308343519031">
    <meta name="google-site-verification" content="z4AVzzjHmDdVSBPd4brJnmdaw-yBe_WRCmFOvXit-0E" />

    <title>Coder Basket - Developer Libraries, Tools & Projects</title>

    <meta name="description"
        content="Coder Basket - Discover developer libraries, open source projects, AI tools, templates and code resources.">

    <link rel="icon" href="/img/codericon.png">

    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <!-- Cloudflare Web Analytics -->
    <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js'
        data-cf-beacon='{"token": "f5bd1cde3c9f413b8a4a490770114d9a"}'></script><!-- End Cloudflare Web Analytics -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9045308343519031"
        crossorigin="anonymous"></script>
</head>

<body>


    <!-- =====================================================
         MAIN
         ===================================================== -->

    <main>

        <!-- =====================================================
             HERO
        ====================================================== -->

        <section class="hero">

            <div class="container">

                <div class="search-box">

                    <input id="searchInput" type="search" placeholder="Search projects, libraries and tools..."
                        autocomplete="off">

                    <button style="display: none;" id="searchButton">
                        Search
                    </button>

                </div>

                <p>
                    Developer libraries, tools, templates and open source projects.
                </p>

            </div>

        </section>


        <!-- =====================================================
             FEATURED NEW SUBMISSIONS
             Loaded dynamically by featured.js
        ====================================================== -->

        <section id="featuredProjects" class="featured-projects" hidden>

            <div class="container">

                <div class="featured-layout">

                    <!-- Match category sidebar width -->
                    <div class="featured-sidebar-space"></div>

                    <!-- Align with catalog-content -->
                    <div class="featured-content">
                        <!-- featured.js renders here -->
                    </div>

                </div>

            </div>

        </section>


        <!-- =====================================================
             CATALOG
        ====================================================== -->

        <section class="catalog-section">

            <div class="container catalog-layout">

                <aside id="categorySidebar" class="category-sidebar">
                    <!-- Rendered dynamically by sidebar.js -->
                </aside>


                <section class="catalog-content">

                    <div class="catalog-header">

                        <h2>Projects & Tools</h2>

                        <div class="sort-select-wrapper">

                            <select id="sortSelect" aria-label="Sort options">


                                <option value="name">
                                    Name
                                </option>

                                <option value="recent">
                                    Recently Updated
                                </option>

                            </select>

                        </div>

                    </div>


                    <div id="projectGrid" class="project-grid">
                    </div>


                    <div id="loading" class="catalog-loading">
                        Loading projects...
                    </div>


                    <button id="loadMore" class="load-more" hidden>
                        Load More
                    </button>

                </section>

            </div>

        </section>

    </main>



    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="/js/data.js" defer></script>
    <script src="/js/sidebar.js" defer></script>
    <script src="/js/header.js" defer></script>
    <script src="/js/repo.js" defer></script>
 
    <script src="/js/sql/sql-wasm.js" defer></script>
    <script src="/js/sql/sql.js" defer></script>

    <script src="/js/apps-script.js" defer></script>

    <script src="/js/app.js" defer></script>
    <script src="/site-config.js"></script>
    <script src="/js/footer.js"></script>
    <!-- <script src="/js/featured.js" defer></script> -->

</body>

</html>
