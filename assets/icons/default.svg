<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF" />
      <stop offset="40%" stop-color="#2563EB" />
      <stop offset="75%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>

    <!-- Box Front & Sides Gradients -->
    <linearGradient id="boxFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    
    <linearGradient id="boxLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <linearGradient id="boxRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="boxInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>

    <!-- Flap Gradients -->
    <linearGradient id="flapLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    
    <linearGradient id="flapRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <linearGradient id="flapFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- Cube Logo Gradient -->
    <linearGradient id="cubeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>

    <!-- Gear Gradient -->
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Code Window Gradient -->
    <linearGradient id="codeWinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Lightbulb Gradients -->
    <radialGradient id="bulbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="1" />
      <stop offset="50%" stop-color="#EAB308" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#CA8A04" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="bulbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>

    <linearGradient id="bulbBase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Leaf Gradients -->
    <linearGradient id="leafBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="leafPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7E22CE" />
    </linearGradient>

    <linearGradient id="folderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.3" />
    </filter>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Square Canvas Background -->
  <rect width="600" height="600" rx="32" fill="url(#bgGrad)" />

  <!-- Abstract Background Shapes & Dots Pattern -->
  <g opacity="0.15">
    <circle cx="120" cy="120" r="150" fill="#FFFFFF" />
    <circle cx="500" cy="320" r="180" fill="#FFFFFF" />
    <circle cx="300" cy="300" r="260" fill="none" stroke="#FFFFFF" stroke-width="40" />
  </g>

  <!-- Decorative Dot Grids -->
  <g fill="#FFFFFF" opacity="0.25">
    <circle cx="480" cy="120" r="2.5" /><circle cx="492" cy="120" r="2.5" /><circle cx="504" cy="120" r="2.5" /><circle cx="516" cy="120" r="2.5" />
    <circle cx="480" cy="132" r="2.5" /><circle cx="492" cy="132" r="2.5" /><circle cx="504" cy="132" r="2.5" /><circle cx="516" cy="132" r="2.5" />
    <circle cx="480" cy="144" r="2.5" /><circle cx="492" cy="144" r="2.5" /><circle cx="504" cy="144" r="2.5" /><circle cx="516" cy="144" r="2.5" />
    <circle cx="480" cy="156" r="2.5" /><circle cx="492" cy="156" r="2.5" /><circle cx="504" cy="156" r="2.5" /><circle cx="516" cy="156" r="2.5" opacity="0.5"/>

    <circle cx="80" cy="380" r="2.5" /><circle cx="92" cy="380" r="2.5" /><circle cx="104" cy="380" r="2.5" />
    <circle cx="80" cy="392" r="2.5" /><circle cx="92" cy="392" r="2.5" /><circle cx="104" cy="392" r="2.5" />
    <circle cx="80" cy="404" r="2.5" /><circle cx="92" cy="404" r="2.5" /><circle cx="104" cy="404" r="2.5" />
  </g>

  <!-- Floating Sparkles / Stars -->
  <!-- Yellow Sparkle Left -->
  <path d="M 140 165 Q 140 175 130 175 Q 140 175 140 185 Q 140 175 150 175 Q 140 175 140 165 Z" fill="#FACC15" filter="url(#glow)" />
  <!-- White Sparkle Top Right -->
  <path d="M 340 105 Q 340 115 330 115 Q 340 115 340 125 Q 340 115 350 115 Q 340 115 340 105 Z" fill="#FFFFFF" />
  <!-- Purple Sparkle Right -->
  <path d="M 490 225 Q 490 232 483 232 Q 490 232 490 239 Q 490 232 497 232 Q 490 232 490 225 Z" fill="#E9D5FF" />

  <!-- Floating Orbs -->
  <circle cx="90" cy="90" r="6" fill="#60A5FA" opacity="0.8" />
  <circle cx="170" cy="135" r="8" fill="#93C5FD" opacity="0.6" />
  <circle cx="490" cy="90" r="14" fill="#A855F7" opacity="0.5" />
  <circle cx="475" cy="380" r="5" fill="#60A5FA" opacity="0.7" />
  <circle cx="100" cy="275" r="9" fill="#38BDF8" opacity="0.6" />

  <!-- Shadow Under Box -->
  <ellipse cx="300" cy="485" rx="220" ry="28" fill="#0C0A09" opacity="0.35" filter="url(#glow)" />

  <!-- MAIN CONTENT GROUP (Centered for 600x600) -->
  <g transform="translate(-100, 50)">

    <!-- BACK / INSIDE ELEMENTS (Emanating from box) -->
    
    <!-- Blue Leaf Left Back -->
    <path d="M 210 210 C 200 150, 250 170, 245 225 Z" fill="url(#leafBlue)" transform="rotate(-20 220 200)" />
    
    <!-- Folder Back Left -->
    <g transform="translate(280, 70) rotate(-8)">
      <rect x="0" y="0" width="130" height="100" rx="12" fill="url(#folderGrad)" filter="url(#shadow)" />
      <path d="M 0 12 Q 0 4 8 4 L 45 4 Q 53 4 58 12 L 65 22 L 122 22 Q 130 22 130 30 L 130 92 Q 130 100 122 100 L 8 100 Q 0 100 0 92 Z" fill="#38BDF8" opacity="0.5" />
    </g>

    <!-- Dark Code Window Center -->
    <g transform="translate(295, 120) rotate(-6)" filter="url(#shadow)">
      <rect x="0" y="0" width="160" height="120" rx="10" fill="url(#codeWinGrad)" stroke="#475569" stroke-width="1" />
      <!-- Window controls -->
      <circle cx="12" cy="12" r="3.5" fill="#EF4444" />
      <circle cx="22" cy="12" r="3.5" fill="#F59E0B" />
      <circle cx="32" cy="12" r="3.5" fill="#10B981" />
      <!-- Code Icon </> -->
      <path d="M 55 68 L 38 52 L 55 36" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 70 32 L 60 72" fill="none" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" />
      <path d="M 75 36 L 92 52 L 75 68" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Gear Left Overlaying Window -->
    <g transform="translate(245, 150) rotate(-15)" filter="url(#shadow)">
      <path d="M 45 20 
               L 41 20 L 39 14 L 43 10 L 37 4 L 33 8 L 27 6 L 27 0 L 19 0 L 19 6 L 13 6 L 9 2 L 3 8 L 7 12 L 5 18 L 0 18 L 0 26 L 5 26 L 7 32 L 3 36 L 9 42 L 13 38 L 19 40 L 19 46 L 27 46 L 27 40 L 33 40 L 37 44 L 43 38 L 39 34 L 41 28 L 45 28 Z" 
            fill="url(#gearGrad)" />
      <circle cx="22.5" cy="23" r="10" fill="#64748B" />
      <circle cx="22.5" cy="23" r="7" fill="#0F172A" />
    </g>

    <!-- Purple Leaf Right -->
    <path d="M 410 230 C 410 160, 480 170, 460 240 Z" fill="url(#leafPurple)" transform="rotate(25 440 200)" />

    <!-- Blue Leaf Outer Right -->
    <path d="M 470 200 C 490 130, 550 170, 500 230 Z" fill="url(#leafBlue)" transform="rotate(35 490 180)" />

    <!-- Lightbulb Right -->
    <!-- Bulb Glow Base -->
    <circle cx="485" cy="155" r="45" fill="url(#bulbGlow)" opacity="0.6" />
    <g transform="translate(440, 100) rotate(18)" filter="url(#shadow)">
      <!-- Rays -->
      <path d="M 45 -10 L 45 -2" stroke="#FACC15" stroke-width="4" stroke-linecap="round" />
      <path d="M 75 5 L 69 11" stroke="#FACC15" stroke-width="4" stroke-linecap="round" />
      <path d="M 85 35 L 77 35" stroke="#FACC15" stroke-width="4" stroke-linecap="round" />
      <path d="M 5 -2 L 12 5" stroke="#FACC15" stroke-width="4" stroke-linecap="round" />
      
      <!-- Bulb Body -->
      <path d="M 20 40 
               C 5 25, 10 0, 45 0 
               C 80 0, 85 25, 70 40 
               C 62 48, 57 53, 57 65 
               L 33 65 
               C 33 53, 28 48, 20 40 Z" 
            fill="url(#bulbGrad)" />
      
      <!-- Filament -->
      <path d="M 38 60 L 38 40 Q 38 30 45 30 Q 52 30 52 40 L 52 60" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- Base / Screw -->
      <path d="M 32 66 L 58 66 L 56 72 L 34 72 Z" fill="url(#bulbBase)" />
      <path d="M 34 73 L 56 73 L 53 79 L 37 79 Z" fill="#475569" />
      <path d="M 37 80 C 37 84, 53 84, 53 80 Z" fill="#1E293B" />
    </g>

    <!-- BOX CONTAINER STRUCTURE -->
    
    <!-- Inside Dark Cavity -->
    <polygon points="235,260 400,290 565,260 400,225" fill="url(#boxInner)" />

    <!-- Back Flap (Left Side) -->
    <path d="M 235 260 L 170 240 L 250 215 L 315 235 Z" fill="#94A3B8" opacity="0.5" />

    <!-- Back Flap (Right Side) -->
    <path d="M 565 260 L 630 240 L 550 215 L 485 235 Z" fill="#64748B" opacity="0.5" />

    <!-- Box Body Front Left Panel -->
    <polygon points="235,260 400,290 400,430 235,390" fill="url(#boxLeft)" />

    <!-- Box Body Front Right Panel -->
    <polygon points="400,290 565,260 565,390 400,430" fill="url(#boxRight)" />

    <!-- Front Left Side Flap Open -->
    <polygon points="235,260 170,240 230,205 295,225" fill="url(#flapLeft)" filter="url(#shadow)" />

    <!-- Front Right Side Flap Open -->
    <polygon points="565,260 630,240 570,205 505,225" fill="url(#flapRight)" filter="url(#shadow)" />

    <!-- Main Front Left Folded Flap Down -->
    <polygon points="235,260 400,290 325,320 180,280" fill="url(#flapFront)" />

    <!-- Main Front Right Folded Flap Down -->
    <polygon points="400,290 565,260 620,280 475,320" fill="#CBD5E1" />

    <!-- Front Face Isometric Cube Logo -->
    <g transform="translate(300, 310)">
      <!-- Outer Hexagon / Isometric Cube -->
      <!-- Top Face -->
      <polygon points="35,0 70,18 35,36 0,18" fill="url(#cubeGrad)" opacity="0.9" />
      <!-- Left Face -->
      <polygon points="0,18 35,36 35,76 0,56" fill="url(#cubeGrad)" />
      <!-- Right Face -->
      <polygon points="35,36 70,18 70,56 35,76" fill="url(#cubeGrad)" opacity="0.8" />

      <!-- Inner Thick Isometric Lines / Outline Style -->
      <g fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
        <!-- Inner Cube Lines -->
        <path d="M 35 36 L 35 74" />
        <path d="M 35 36 L 3 20" />
        <path d="M 35 36 L 67 20" />
        
        <!-- Outer Border -->
        <polygon points="35,2 68,18 68,56 35,74 2,56 2,18" stroke-width="4" />
      </g>
    </g>

    <!-- Highlight Rim Effects on Box Edge -->
    <polygon points="235,260 400,290 400,293 235,263" fill="#FFFFFF" opacity="0.6" />
    <polygon points="400,290 565,260 565,263 400,293" fill="#FFFFFF" opacity="0.3" />
    
  </g>
</svg>
