<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coder Basket - JSON Generator & Submitter</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --border: #334155;
            --chip-bg: #0f172a;
            --chip-selected: #38bdf8;
            --chip-selected-text: #0f172a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        h1 {
            font-size: 1.75rem;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        .input-group {
            display: flex;
            gap: 0.75rem;
        }

        input[type="text"] {
            width: 100%;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: var(--text-color);
            font-size: 1rem;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
        }

        button.primary-btn {
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
            white-space: nowrap;
        }

        button.primary-btn:hover {
            background-color: var(--accent-hover);
        }

        /* Categories Section & Search */
        .categories-container {
            margin-top: 1.5rem;
        }

        .categories-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .categories-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .category-search-input {
            width: 100%;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.6rem 0.9rem;
            color: var(--text-color);
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
        }

        .category-search-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .category-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            max-height: 200px;
            overflow-y: auto;
            padding: 0.5rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .category-chip {
            background-color: var(--chip-bg);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 0.4rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
        }

        .category-chip:hover {
            border-color: var(--accent);
            color: var(--text-color);
        }

        .category-chip.selected {
            background-color: var(--chip-selected);
            color: var(--chip-selected-text);
            font-weight: 600;
            border-color: var(--chip-selected);
        }

        .view-all-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--accent);
            padding: 0.35rem 0.75rem;
            font-size: 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .view-all-btn:hover {
            background-color: var(--border);
        }

        /* Modal Overlay */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .modal-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 100%;
            max-width: 800px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .modal-close-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .modal-close-btn:hover {
            color: var(--text-color);
        }

        .modal-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            overflow-y: auto;
            padding: 0.5rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            flex: 1;
        }

        pre {
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            overflow-x: auto;
            color: #38bdf8;
            font-size: 0.9rem;
            margin: 0;
            max-height: 400px;
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .copy-btn {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-color);
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .copy-btn:hover {
            background-color: var(--border);
        }

        .loader {
            display: none;
            color: var(--accent);
            margin-top: 1rem;
            font-size: 0.95rem;
        }

        .error {
            color: #ef4444;
            margin-top: 1rem;
        }

        /* Custom Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
            transition: background 0.2s;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        * {
            scrollbar-width: thin;
            scrollbar-color: var(--border) var(--bg-color);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Coder Basket Submitter</h1>
        <p class="subtitle">Enter a GitHub repository URL, search or select your categories, and generate your clean
            JSON snippet.</p>

        <div class="card">
            <div class="input-group">
                <input type="text" id="repoInput" placeholder="https://github.com/owner/repository" value="">
                <button class="primary-btn" id="generateBtn" onclick="processRepository()">Generate JSON</button>
            </div>

            <!-- Categories Section with Search & Modal Trigger -->
            <div class="categories-container">
                <div class="categories-header-row">
                    <span class="categories-title">Categories (<span id="selectedCount" style="color: var(--accent);">0
                            selected</span>)</span>
                    <button class="view-all-btn" onclick="openCategoriesModal()">View All Categories</button>
                </div>

                <input type="text" id="categorySearch" class="category-search-input" placeholder="Search categories..."
                    oninput="filterCategories()">

                <div class="category-grid" id="categoryGrid"></div>
            </div>

            <div id="loader" class="loader">Fetching repository details and scanning README...</div>
            <div id="errorMsg" class="error"></div>
        </div>
    </div>

    <!-- Full Modal View for All Categories -->
    <div class="modal-overlay" id="categoriesModal">
        <div class="modal-card">
            <div class="modal-header">
                <strong>Select Categories (All Options)</strong>
                <button class="modal-close-btn" onclick="closeCategoriesModal()">&times;</button>
            </div>
            <input type="text" id="modalCategorySearch" class="category-search-input" placeholder="Search in modal..."
                oninput="filterModalCategories()">
            <div class="modal-grid" id="modalCategoryGrid"></div>
            <div style="margin-top: 1rem; text-align: right;">
                <button class="primary-btn" onclick="closeCategoriesModal()"
                    style="padding: 0.5rem 1rem; font-size: 0.9rem;">Done</button>
            </div>
        </div>
    </div>

    <!-- Generated JSON Result Modal Popup -->
    <div class="modal-overlay" id="resultModal">
        <div class="modal-card">
            <div class="modal-header">
                <strong>Generated JSON Result</strong>
                <button class="modal-close-btn" onclick="closeResultModal()">&times;</button>
            </div>
            <div class="output-header" style="margin-top: 0.5rem;">
                <span style="color: var(--text-muted); font-size: 0.85rem;">Ready to submit or copy</span>
                <button class="copy-btn" onclick="copyJson()">Copy JSON</button>
            </div>
            <pre><code id="jsonOutput"></code></pre>
            <div style="margin-top: 1rem; text-align: right;">
                <button class="primary-btn" onclick="closeResultModal()"
                    style="padding: 0.5rem 1rem; font-size: 0.9rem;">Close</button>
            </div>
        </div>
    </div>

    <script>
        const GITHUB_API = "https://api.github.com";

        const CATEGORIES = {
            1: "About", 2: "Activity Feeds", 3: "Calculators", 4: "Calendars & Time", 5: "Cards", 6: "Charts", 7: "Comments", 8: "Dashboard", 9: "Filter", 10: "Friends",
            11: "Launch Screen", 12: "Lists", 13: "Login", 14: "Maps", 15: "Messaging", 16: "Navigations", 17: "Notifications", 18: "Photos", 19: "Playback", 20: "Popovers",
            21: "Products", 22: "Profiles", 23: "Search", 24: "Settings", 25: "Share", 26: "Shopping Cart", 27: "Sidebars", 28: "Signups", 29: "Tabbars", 30: "Timeline",
            31: "Walkthroughs", 32: "Widgets", 33: "Data Grid", 34: "App Clone", 35: "Articles", 36: "Errors", 37: "Stores", 38: "Neomorphism", 39: "Social Network", 40: "Carousel",
            41: "Others", 42: "Tools", 43: "Games", 44: "Animations", 45: "Controls", 46: "Libraries",
            47: "LLM", 48: "AI Agents", 49: "RAG", 50: "Computer Vision", 51: "Speech & Audio", 52: "Local AI", 53: "Generative AI", 54: "AI Assistants", 55: "AI Automation", 56: "AI Chat", 57: "AI Coding", 58: "AI Search", 59: "AI Image Generation", 60: "AI Video Generation", 61: "AI Music", 62: "AI Embeddings", 63: "AI Models", 64: "Model Training", 65: "Model Evaluation",
            66: "Machine Learning", 67: "Deep Learning", 68: "Natural Language Processing", 69: "Recommendation Systems", 70: "Classification", 71: "Object Detection", 72: "Image Classification", 73: "Speech Recognition", 74: "Text to Speech", 75: "Data Science",
            76: "Developer Tools", 77: "Development Environment", 78: "Code Editor", 79: "Debugging", 80: "Testing", 81: "Profiling", 82: "API", 83: "REST API", 84: "GraphQL", 85: "CLI", 86: "Command Line", 87: "Package Manager", 88: "Build Tools", 89: "Compilers", 90: "Code Generators",
            91: "Web Development", 92: "JavaScript", 93: "TypeScript", 94: "HTML", 95: "CSS", 96: "Frontend", 97: "Backend", 98: "Full Stack", 99: "Web Components", 100: "Progressive Web Apps", 101: "WebAssembly",
            102: "Databases", 103: "SQLite", 104: "PostgreSQL", 105: "MySQL", 106: "NoSQL", 107: "Data Processing", 108: "Data Visualization", 109: "Data Import", 110: "Data Export",
            111: "Cloud", 112: "Cloud Computing", 113: "Cloud Storage", 114: "Serverless", 115: "Containers", 116: "Docker", 117: "Kubernetes", 118: "DevOps", 119: "CI/CD", 120: "Monitoring",
            121: "Security", 122: "Authentication", 123: "Authorization", 124: "Encryption", 125: "Privacy",
            126: "Audio", 127: "Video", 128: "Image Processing", 129: "Image Editing", 130: "Media Player", 131: "Streaming", 132: "Recording", 133: "Audio Processing",
            134: "Productivity", 135: "Notes", 136: "Task Management", 137: "File Management", 138: "Document Management", 139: "Text Editing", 140: "Time Tracking",
            141: "UI Libraries", 142: "Design Systems", 143: "Themes", 144: "Dark Mode", 145: "Light Mode", 146: "Responsive Design", 147: "Accessibility", 148: "Material Design", 149: "Fluent Design",
            150: "Networking", 151: "HTTP", 152: "WebSocket", 153: "Networking Tools", 154: "Download Managers", 155: "Remote Access",
            156: "Education", 157: "Learning", 158: "Documentation", 159: "Tutorials", 160: "Reference",
            161: "Utilities", 162: "File Utilities", 163: "System Utilities", 164: "Converters", 165: "Generators", 166: "Parsers", 167: "Formatters", 168: "Validators",
            169: "Architecture", 170: "Frameworks", 171: "Libraries & SDKs", 172: "Components", 173: "Plugins", 174: "Extensions", 175: "Templates",
            176: "Cross Platform", 177: "Desktop", 178: "Mobile", 179: "Windows", 180: "macOS", 181: "Linux", 182: "Android", 183: "iOS",
            184: "Open Source", 185: "Experimental", 186: "Educational", 187: "Reference Implementation", 188: "Samples", 189: "Starter Projects"
        };

        const selectedCategories = new Set();

        function renderGrids() {
            renderGridContainer("categoryGrid", document.getElementById("categorySearch").value);
            renderGridContainer("modalCategoryGrid", document.getElementById("modalCategorySearch").value);
        }

        function renderGridContainer(containerId, filterText) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = "";

            const query = (filterText || "").toLowerCase();

            for (const [id, name] of Object.entries(CATEGORIES)) {
                const displayText = `${id}. ${name}`;
                if (query && !displayText.toLowerCase().includes(query)) continue;

                const chip = document.createElement("div");
                chip.className = "category-chip";
                if (selectedCategories.has(Number(id))) {
                    chip.classList.add("selected");
                }
                chip.textContent = displayText;
                chip.dataset.id = id;

                chip.addEventListener("click", () => {
                    const numId = Number(id);
                    if (selectedCategories.has(numId)) {
                        selectedCategories.delete(numId);
                    } else {
                        selectedCategories.add(numId);
                    }
                    updateSelectedCount();
                    renderGrids();
                });

                container.appendChild(chip);
            }
        }

        function filterCategories() {
            renderGridContainer("categoryGrid", document.getElementById("categorySearch").value);
        }

        function filterModalCategories() {
            renderGridContainer("modalCategoryGrid", document.getElementById("modalCategorySearch").value);
        }

        function updateSelectedCount() {
            document.getElementById("selectedCount").textContent = `${selectedCategories.size} selected`;
        }

        function openCategoriesModal() {
            document.getElementById("categoriesModal").style.display = "flex";
            renderGridContainer("modalCategoryGrid", document.getElementById("modalCategorySearch").value);
        }

        function closeCategoriesModal() {
            document.getElementById("categoriesModal").style.display = "none";
            renderGrids();
        }

        function openResultModal() {
            document.getElementById("resultModal").style.display = "flex";
        }

        function closeResultModal() {
            document.getElementById("resultModal").style.display = "none";
        }

        document.addEventListener("DOMContentLoaded", () => {
            renderGrids();
        });

        function cleanGitHubUrl(inputUrl) {
            try {
                const parsed = new URL(inputUrl);
                if (parsed.hostname !== "github.com") return null;
                let cleanPath = parsed.pathname.replace(/\/+$/, "");
                return `${parsed.origin}${cleanPath}`;
            } catch {
                return null;
            }
        }

        async function processRepository() {
            const rawInput = document.getElementById("repoInput").value.trim();
            const loader = document.getElementById("loader");
            const errorMsg = document.getElementById("errorMsg");
            const jsonOutput = document.getElementById("jsonOutput");

            errorMsg.textContent = "";

            if (!rawInput) {
                errorMsg.textContent = "Please enter a valid GitHub repository URL.";
                return;
            }

            const cleanUrl = cleanGitHubUrl(rawInput);
            if (!cleanUrl) {
                errorMsg.textContent = "Invalid GitHub repository URL format.";
                return;
            }

            const repoInfo = parseGitHubRepository(cleanUrl);
            if (!repoInfo) {
                errorMsg.textContent = "Could not parse owner and repository name from URL.";
                return;
            }

            loader.style.display = "block";

            try {
                const repoData = await fetchRepoData(repoInfo);
                const branch = repoData.default_branch || "main";

                let resolvedImage = null;
                try {
                    const readmeHtml = await fetchReadmeHtml(repoInfo);
                    resolvedImage = extractBestImage(readmeHtml, repoInfo, branch);
                } catch (e) {
                    console.warn("Could not parse README:", e);
                }

                // Fallback priority: Scraped Screenshot -> Fallback Icon/Graphics -> OpenGraph Card
                const imageUrl = resolvedImage || `https://opengraph.githubassets.com/1/${repoInfo.owner}/${repoInfo.repo}`;
                const platforms = detectPlatforms(repoData);

                const generatedJson = {
                    "project_url": cleanUrl,
                    "title": repoData.name || "Untitled Project",
                    "description": repoData.description || "No description provided.",
                    "section": repoData.language ? repoData.language.toLowerCase() : "others",
                    "section_category": repoData.topics && repoData.topics.length > 0 ? repoData.topics[0] : "general",
                    "technologies": [
                        ...(repoData.language ? [repoData.language] : []),
                        ...(repoData.topics ? repoData.topics.slice(0, 3) : [])
                    ],
                    "platforms": platforms,
                    "external_url": repoData.homepage || null,
                    "youtube_url": null,
                    "image_url": imageUrl,
                    "categories": Array.from(selectedCategories)
                };

                jsonOutput.textContent = JSON.stringify(generatedJson, null, 2);
                openResultModal();
            } catch (err) {
                errorMsg.textContent = err.message;
            } finally {
                loader.style.display = "none";
            }
        }

        function parseGitHubRepository(url) {
            try {
                const parsed = new URL(url);
                const parts = parsed.pathname.split("/").filter(Boolean);
                if (parts.length < 2) return null;
                return {
                    owner: parts[0],
                    repo: parts[1].replace(/\.git$/, "")
                };
            } catch {
                return null;
            }
        }

        async function fetchRepoData(repo) {
            const res = await fetch(`${GITHUB_API}/repos/${repo.owner}/${repo.repo}`, {
                headers: { Accept: "application/vnd.github+json" }
            });
            if (!res.ok) {
                if (res.status === 404) throw new Error("Repository not found.");
                if (res.status === 403) throw new Error("GitHub API rate limit reached.");
                throw new Error(`GitHub API error: ${res.status}`);
            }
            return await res.json();
        }

        async function fetchReadmeHtml(repo) {
            const res = await fetch(`${GITHUB_API}/repos/${repo.owner}/${repo.repo}/readme`, {
                headers: { Accept: "application/vnd.github.html" }
            });
            if (!res.ok) return "";
            return await res.text();
        }

        function extractBestImage(html, repository, branch) {
            const template = document.createElement("template");
            template.innerHTML = html;
            const images = template.content.querySelectorAll("img");

            let fallbackIcon = null;

            for (const img of images) {
                let src = img.getAttribute("src");
                if (!src) continue;

                // Make relative URLs absolute
                if (!/^https?:\/\//i.test(src)) {
                    src = `https://raw.githubusercontent.com/${repository.owner}/${repository.repo}/${branch}/${src.replace(/^\.?\//, "")}`;
                }

                const lower = src.toLowerCase();

                // Skip badges, shields, and SVG files entirely
                if (
                    lower.includes("badge") ||
                    lower.includes("shields.io") ||
                    lower.includes("camo.githubusercontent.com") ||
                    lower.endsWith(".svg")
                ) {
                    continue;
                }

                // Check if it's an icon, logo, or in a graphics folder (good fallback candidate)
                const isIconOrGraphic =
                    lower.includes("logo") ||
                    lower.includes("icon") ||
                    lower.includes("/graphics/") ||
                    lower.includes("/assets/icon");

                if (isIconOrGraphic) {
                    if (!fallbackIcon) {
                        fallbackIcon = src; // Save as fallback if no pure screenshot is found yet
                    }
                    continue;
                }

                // If it passes all exclusions and isn't marked as an icon/graphic, consider it a valid screenshot!
                return src;
            }

            // If no clean screenshot was found, return the fallback icon/graphic if available
            return fallbackIcon;
        }

        function detectPlatforms(data) {
            const combined = `${data.language || ""} ${(data.topics || []).join(" ")}`.toLowerCase();
            const detected = [];

            if (combined.includes("android")) detected.push("android");
            if (combined.includes("ios") || combined.includes("iphone") || combined.includes("ipad")) detected.push("ios");
            if (combined.includes("windows") || combined.includes("winui")) detected.push("windows");
            if (combined.includes("web") || combined.includes("javascript") || combined.includes("typescript")) detected.push("web");
            if (combined.includes("linux")) detected.push("linux");
            if (combined.includes("macos")) detected.push("macos");

            return detected.length > 0 ? detected : ["web"];
        }

        function copyJson() {
            const text = document.getElementById("jsonOutput").textContent;
            navigator.clipboard.writeText(text).then(() => {
                alert("JSON copied to clipboard!");
            });
        }
    </script>
</body>

</html>
