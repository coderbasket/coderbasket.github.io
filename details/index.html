<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coder Basket - Project Details</title>

    <meta name="description"
        content="View project details, repository information, documentation and resources on Coder Basket.">

    <link rel="icon" href="/img/codericon.png">

    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <!-- Cloudflare Web Analytics -->
    <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js'
        data-cf-beacon='{"token": "f5bd1cde3c9f413b8a4a490770114d9a"}'></script><!-- End Cloudflare Web Analytics -->
</head>

<body>


    <!-- =====================================================
         MAIN
         ===================================================== -->

    <main class="detail-page">

        <div id="detailLoading" class="detail-loading" aria-label="Loading"></div>

        <div class="container detail-layout">




            <!-- PROJECT CONTENT -->
            <div class="detail-content">

                <div id="detailError" class="detail-error" hidden>

                    <h1>Project Not Found</h1>

                    <p>
                        We could not load this project.
                    </p>

                    <a href="/">
                        Return to Coder Basket
                    </a>

                </div>


                <article id="projectDetail" class="project-detail" hidden>

                    <div id="projectCategory" class="project-category">
                    </div>


                    <header class="project-header">

                        <div class="project-header-main">

                            <h1 id="projectTitle"></h1>

                            <div id="projectAuthor" class="project-author">
                            </div>

                        </div>

                        <div id="projectActions" class="project-actions">
                        </div>

                    </header>


                    <section class="detail-section" id="descriptionSection">

                        <h2>DESCRIPTION</h2>

                        <div id="projectDescription" class="project-description">
                        </div>

                    </section>


                    <section class="detail-section" id="platformsSection" hidden>

                        <h2>PLATFORMS</h2>

                        <div id="projectPlatforms" class="project-platforms">
                        </div>

                    </section>


                    <section class="detail-section" id="statsSection">

                        <div id="projectStats" class="project-stats">
                        </div>

                    </section>


                    <section class="detail-section" id="repositorySection">

                        <h2>CHECK OUT THE CODE</h2>

                        <div id="repositoryCard" class="repository-card">
                        </div>

                    </section>


                    <section class="detail-section" id="homepageSection" hidden>

                        <h2>PROJECT WEBSITE</h2>

                        <div id="projectHomepage"></div>

                    </section>


                    <section class="detail-section" id="youtubeSection" hidden>

                        <h2>WATCH ON YOUTUBE</h2>

                        <div id="projectYoutube" class="project-video">
                        </div>

                    </section>


                    <section class="detail-section" id="screenshotsSection" hidden>

                        <h2>SCREENSHOTS</h2>

                        <div id="projectScreenshots" class="project-screenshots">
                        </div>

                    </section>


                    <section class="detail-section" id="readmeSection" hidden>

                        <h2>README</h2>

                        <div id="projectReadme" class="project-readme">
                        </div>

                    </section>

                </article>

            </div>
            <aside class="detail-ad-column">
                <!-- AdSense -->
            </aside>
        </div>

    </main>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="/js/data.js" defer></script>

    <script src="/js/repo.js" defer></script>
    //sqlite
    <script src="/js/sql/sql-wasm.js" defer></script>
    <script src="/js/sql/sql.js" defer></script>

    <script src="/js/apps-script.js" defer></script>

    <script src="/js/app.js" defer></script>
    <script src="script.js" defer></script>

    <!-- <script src="/js/sidebar.js" defer></script> -->
    <script src="/js/header.js" defer></script>
    <script src="/site-config.js"></script>
    <script src="/js/footer.js"></script>

</body>

</html>
